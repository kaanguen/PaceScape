<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Magic Leap 2 running lab: isometric concept setup and data flow</title>
<desc>Editable vector concept diagram showing a runner on treadmill wearing Magic Leap 2, the Femto Bolt RGB-D camera, a local workstation, augmented cadence, posture and ghost cues, and offline Ochy integration.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D1728"/><stop offset="1" stop-color="#162A3B"/></linearGradient>
 <linearGradient id="deck" x2="0" y2="1"><stop stop-color="#34465B"/><stop offset="1" stop-color="#192633"/></linearGradient>
 <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#4D6777" opacity=".22"/></pattern>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#52DABF" stroke-width="1.6"/></marker>
 <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#B3A2FF" stroke-width="1.6"/></marker>
 <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#dots)"/>
<g id="heading" font-family="DejaVu Sans,Arial,sans-serif">
 <text x="82" y="89" fill="#F0F6F9" font-size="39" font-weight="700">RUNNING LAB  /  SPATIAL COACH</text>
 <text x="84" y="130" fill="#A4BAC7" font-size="19">Magic Leap 2  ·  Treadmill-first proof of concept  ·  Concept layout (not to scale)</text>
 <path d="M82 156H1518" stroke="#3A5365" stroke-width="2"/>
</g>
<g id="treadmill-setup">
