  <path d="M704 680l-23 16 50 12 13-14-21-10ZM789 673l-3 24 46-8-8-18Z" fill="#D5F1F5" stroke="#183345" stroke-width="4"/>
  <!-- pose joints -->
  <g fill="#83EBDD" stroke="#163849" stroke-width="3"><circle cx="727" cy="486" r="7"/><circle cx="683" cy="560" r="7"/><circle cx="835" cy="556" r="7"/><circle cx="700" cy="679" r="7"/><circle cx="795" cy="669" r="7"/><circle cx="754" cy="389" r="7"/></g>
 </g>
 <!-- posture cue and spatial reference -->
