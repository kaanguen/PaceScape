 <path d="M290 722L912 907 1328 692 707 519Z" fill="#263749" opacity=".26" stroke="#456376" stroke-width="1.5"/>
 <!-- treadmill platform isometric -->
 <path d="M388 724L813 847 1132 679 715 558Z" fill="#1D2A39" stroke="#84A3B5" stroke-width="3"/>
 <path d="M388 724v32L813 879v-32Z" fill="#14212F" stroke="#5E7D8F" stroke-width="2"/>
 <path d="M813 847v32l319-168v-32Z" fill="#213448" stroke="#5E7D8F" stroke-width="2"/>
 <path d="M448 717L813 820 1063 686 703 584Z" fill="url(#deck)" stroke="#567E93" stroke-width="2"/>
 <!-- moving belt lines -->
 <path d="M524 715l330 94M603 680l335 97M676 641l339 93" fill="none" stroke="#435E71" stroke-width="2" stroke-dasharray="17 15"/>
