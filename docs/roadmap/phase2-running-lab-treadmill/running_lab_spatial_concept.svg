  <path d="M327 517L680 350 925 731 320 549Z" fill="#55DCC6" opacity=".08"/>
  <path d="M325 517L679 349M325 549L925 731" fill="none" stroke="#59E1CE" stroke-width="2" stroke-dasharray="11 9" opacity=".67"/>
 </g>
 <!-- workstation -->
 <g id="workstation">
  <path d="M1169 798l158-78 103 39-161 82Z" fill="#324A5E" stroke="#93AABB" stroke-width="2"/>
  <path d="M1210 678l153-43 10 104-152 44Z" fill="#1E3243" stroke="#A3B8C7" stroke-width="5"/>
  <path d="M1226 685l122-34 8 73-124 37Z" fill="#0B2738"/>
