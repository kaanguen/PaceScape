 <g id="footer" font-family="DejaVu Sans,Arial,sans-serif"><rect x="83" y="947" width="480" height="35" rx="9" fill="#283748"/><circle cx="105" cy="964" r="5" fill="#5DE0CC"/><text x="120" y="969" font-size="14" fill="#D2E1E7">LIVE TRACKING</text><circle cx="279" cy="964" r="5" fill="#B4A2FF"/><text x="295" y="969" font-size="14" fill="#D2E1E7">AR / GHOST</text><text x="1468" y="971" text-anchor="end" fill="#829AA9" font-size="13">Editable schematic · equipment positions illustrative</text></g>
</svg>