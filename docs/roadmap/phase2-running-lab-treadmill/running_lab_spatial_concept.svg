  <g stroke="#4DE9D3" stroke-width="3" fill="none"><circle cx="1293" cy="670" r="7"/><path d="M1293 678l2 28-18 21m18-21 21 14m-21-28-15 11m15-11 17 9"/></g>
  <path d="M1279 751v23m-36 14l63-18" stroke="#9CB4BF" stroke-width="5"/>
  <rect x="1176" y="762" width="46" height="59" rx="7" fill="#233A4F" stroke="#8BA6B7" stroke-width="2"/>
  <circle cx="1199" cy="773" r="4" fill="#49E1C9"/>
 </g>
 <!-- labels and cards -->
 <g id="labels" font-family="DejaVu Sans,Arial,sans-serif">
  <g id="label-headset"><rect x="845" y="203" rx="14" width="271" height="81" fill="#223949" stroke="#5ACFC3" stroke-width="1.5"/><text x="868" y="237" fill="#F1F8F9" font-weight="700" font-size="21">MAGIC LEAP 2</text><text x="868" y="261" fill="#AFC9D4" font-size="16">Spatial coaching overlay</text><path d="M846 267l-66 38" stroke="#5ACFC3" stroke-width="2"/></g>
  <g id="label-sensor"><rect x="93" y="338" rx="14" width="300" height="103" fill="#203B4B" stroke="#6BE5D6" stroke-width="1.5"/><text x="115" y="375" fill="#EEF8FA" font-size="21" font-weight="700">FEMTO BOLT</text><text x="115" y="403" fill="#B7D0D6" font-size="16">Fixed RGB-D + skeleton</text><text x="115" y="427" fill="#90B1C1" font-size="14">Front/side-oblique tracking</text><path d="M260 441l7 59" stroke="#65E4D4" stroke-width="2"/></g>
  <g id="cadence-label"><rect x="378" y="183" rx="14" width="286" height="103" fill="#263E4D" stroke="#53DED0" stroke-width="1.5"/><text x="402" y="218" fill="#8AF4E7" font-size="16" font-weight="700">LIVE CUE / EXAMPLE</text><text x="402" y="252" fill="#F6FAFB" font-size="31" font-weight="700">172 <tspan font-size="16">spm</tspan></text><path d="M624 286L731 355" stroke="#53DED0" stroke-width="2" stroke-dasharray="6 6"/></g>
  <g id="ring-label"><rect x="300" y="823" rx="13" width="337" height="67" fill="#203949" stroke="#58E2D4"/><text x="324" y="852" font-size="19" font-weight="700" fill="#F1F8F9">Step-timing rings</text><text x="324" y="876" font-size="15" fill="#A9C8D0">Treadmill-anchored target zones</text><path d="M612 825L731 762" stroke="#5EE5D6" stroke-width="2"/></g>
  <g id="ghost-label"><rect x="1108" y="306" rx="13" width="391" height="83" fill="#302F51" stroke="#B4A2FF"/><text x="1133" y="342" fill="#F5F0FF" font-size="21" font-weight="700">GHOST PACER / REPLAY</text><text x="1133" y="366" fill="#C9C2E8" font-size="16">Translucent stride-phase reference</text><path d="M1108 348L881 423" fill="none" stroke="#B4A2FF" stroke-width="2" stroke-dasharray="8 6"/></g>
  <g id="pc-label"><rect x="1175" y="852" rx="13" width="337" height="74" fill="#203746" stroke="#7B9AAD"/><text x="1197" y="882" fill="#F2F8F9" font-size="20" font-weight="700">LOCAL WORKSTATION</text><text x="1197" y="906" fill="#ADC2CA" font-size="15">Pose → gait events → stream</text></g>
 </g>
 <!-- data flow paths -->
 <g id="data-paths" fill="none" stroke-linecap="round">
