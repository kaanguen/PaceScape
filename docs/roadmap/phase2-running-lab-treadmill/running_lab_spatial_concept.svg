 <ellipse cx="850" cy="707" rx="50" ry="24" transform="rotate(16 850 707)" fill="#37D7D0" fill-opacity=".08" stroke="#46E4D5" stroke-width="3" stroke-dasharray="7 7"/>
 <path d="M737 734v-26M851 686v-25" stroke="#4AF1E0" stroke-width="2" stroke-dasharray="4 4"/>
