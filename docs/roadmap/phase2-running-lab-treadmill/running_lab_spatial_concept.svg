 <path d="M1031 691L1070 469M860 814L900 582" stroke="#6B8293" stroke-width="12" stroke-linecap="round"/>
 <path d="M891 565L1066 480" stroke="#859CAB" stroke-width="13" stroke-linecap="round"/>
 <path d="M1001 491l66-27 38 29-65 31Z" fill="#263D4F" stroke="#93A9B7" stroke-width="2"/>
